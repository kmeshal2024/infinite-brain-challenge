name: infinite_brain_challenge
description: A premium brain-training game with multiple mini-games.
publish_to: 'none'
version: 1.3.3+9

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_riverpod: ^2.4.9
  go_router: ^13.0.0
  shared_preferences: ^2.2.2
  google_fonts: ^6.1.0
  intl: ^0.19.0
  audioplayers: ^5.2.1
  flutter_animate: ^4.3.0
  applovin_max: ^4.1.0
  in_app_review: ^2.0.9
  # --- Add when ready ---
  # fl_chart: ^0.66.0           # Stats charts
  # hive_flutter: ^1.1.0        # Heavy local data
  # firebase_core: ^2.24.0
  # firebase_messaging: ^14.7.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  image: ^4.8.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.6

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#0D0F1A"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"

flutter_native_splash:
  color: "#0D0F1A"
  image: "assets/icon/app_icon.png"
  android: true
  ios: true
  web: true
  android_12:
    color: "#0D0F1A"
    icon_background_color: "#0D0F1A"
    image: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/sounds/
    - assets/icon/
